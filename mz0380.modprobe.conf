#
# Installed as /etc/modprobe.d/mz0380.conf by `sudo make install`.
#
# The driver's built-in defaults are the validated 1080p60 H.264 capture
# configuration as of M216, so this file deliberately sets NOTHING by default -
# the card works with a plain `modprobe mz0380`, and anything overridden here
# would silently diverge from the module's own defaults the moment those change.
#
# It exists to pull in the V4L2/ALSA dependencies and to document the knobs
# worth knowing, commented out.
#

# videobuf2 and the DV-timings helpers are not auto-pulled by a PCI probe.
softdep mz0380 pre: videodev videobuf2-v4l2 videobuf2-vmalloc v4l2-dv-timings snd-pcm

# ---------------------------------------------------------------------------
# Raw (uncompressed I420) capture - EXPERIMENTAL, see RE_FINDINGS M213-M215.
#
# post_mask bit 0 enables the card's preview frame-selection bitmap. Without it
# the card writes a 16-byte stub per frame; with it, whole 3110400-byte I420
# frames land in the op 0x02 buffers.
#
# The bitmap step is post_skip+1, so post_skip=0 selects EVERY frame: at 1080p60
# that is ~186 MB/s on a link this card negotiates as PCIe x1 Gen1 (~250 MB/s
# theoretical), on top of the H.264 stream. Start high and walk down.
#
# raw_bank_observe is read at insmod - the banks are allocated at PCI probe -
# so it cannot be turned on through sysfs afterwards.
#
# Frames are not yet delivered to V4L2 in this mode; they land in the driver's
# buffers and the completion path does not pick them up. Diagnostic only.
#
#options mz0380 post_mask=0x01 post_skip=29 raw_bank_observe=1

# ---------------------------------------------------------------------------
# Troubleshooting knobs.
#
# procfs_verbosity=2   more detail in /proc/mz0380-state (default already 2 via
#                      the load scripts; the module default is lower)
# persistent_h264=0    tear the card-side encoder down at every STREAMOFF.
#                      Leave this at 1. Each rebuild is one encoder spawn, and
#                      the card wedges permanently somewhere in the 8-18 spawn
#                      range per power cycle - recoverable only by removing
#                      mains power, because slot standby keeps the card alive.
# poll_drain_ms=20     legacy fw=5 poll-drain path; not needed under fw=7.
#
#options mz0380 procfs_verbosity=2
