#
# DKMS recipe for the mz0380 driver (Elgato Game Capture HD60 Pro / YUAN MZ0380).
#
# Install with:
#     sudo make dkms-install
#
# which copies this tree to /usr/src/mz0380-<version>, registers it, and builds
# it for the running kernel. DKMS then rebuilds it automatically on every kernel
# upgrade, which is the whole point: an out-of-tree module that is not in DKMS
# silently stops loading the next time the kernel changes.
#
PACKAGE_NAME="mz0380"
PACKAGE_VERSION="0.1.0"

# The top-level Makefile takes the kernel to build against as KVER, and leaves
# mz0380.ko at the root of the tree rather than under src/ - kbuild puts the
# linked module where obj-m was declared, which is the top level, even though
# every object it links comes from src/.
MAKE[0]="make KVER=${kernelver}"
CLEAN="make clean"

BUILT_MODULE_NAME[0]="mz0380"
BUILT_MODULE_LOCATION[0]=""
DEST_MODULE_LOCATION[0]="/kernel/drivers/media/pci/mz0380"

AUTOINSTALL="yes"
